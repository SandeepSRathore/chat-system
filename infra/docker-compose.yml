# Infrastructure only:        docker compose up -d
# Full system (2x each svc):  docker compose --profile app up -d --build   → http://localhost:8000
name: chat-system

x-jwt-secret: &jwt-secret "change-me-change-me-change-me-change-me-0123456789"

x-common-env: &common-env
  CHAT_JWT_SECRET: *jwt-secret
  SPRING_DATA_REDIS_HOST: redis

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      retries: 20

  cassandra:
    restart: unless-stopped
    image: cassandra:5.0
    environment:
      CASSANDRA_CLUSTER_NAME: chat
      CASSANDRA_DC: datacenter1
      MAX_HEAP_SIZE: 448M
      HEAP_NEWSIZE: 96M
    ports: ["9042:9042"]
    volumes: [cassandradata:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 10s
      retries: 30

  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra: { condition: service_healthy }
    volumes: [./cassandra-init.cql:/init.cql:ro]
    entrypoint: ["cqlsh", "cassandra", "-f", "/init.cql"]
    restart: "no"

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    # AOF keeps message-id sequences across restarts; Ex enables key-expiry events for presence.
    command: ["redis-server", "--appendonly", "yes", "--notify-keyspace-events", "Ex"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  zookeeper:
    restart: unless-stopped
    image: zookeeper:3.9
    ports: ["2181:2181"]
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok || zkServer.sh status"]
      interval: 5s
      retries: 20

  kafka:
    restart: unless-stopped
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20

  # ---------------------------------------------------------------- application (profile: app)
  api-1: &api
    profiles: [app]
    restart: unless-stopped
    build: { context: ../backend, dockerfile: ../infra/Dockerfile.service, args: { MODULE: api-service } }
    environment: &api-env
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chat
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra:9042
      CHAT_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on: &app-deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      zookeeper: { condition: service_healthy }
      kafka: { condition: service_healthy }
      cassandra-init: { condition: service_completed_successfully }
  api-2: *api

  chat-1: &chat
    profiles: [app]
    restart: unless-stopped
    build: { context: ../backend, dockerfile: ../infra/Dockerfile.service, args: { MODULE: chat-service } }
    container_name: chat-1
    environment: &chat-env
      <<: *common-env
      SERVER_PORT: "8091"
      CHAT_SERVER_ID: chat-1
      CHAT_PUBLIC_WS_URL: ws://localhost:8091/ws/chat
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra:9042
      CHAT_ZOOKEEPER_CONNECT: zookeeper:2181
    ports: ["8091:8091"]
    depends_on: *app-deps
  chat-2:
    <<: *chat
    container_name: chat-2
    environment:
      <<: *chat-env
      SERVER_PORT: "8092"
      CHAT_SERVER_ID: chat-2
      CHAT_PUBLIC_WS_URL: ws://localhost:8092/ws/chat
    ports: ["8092:8092"]

  presence-1: &presence
    profiles: [app]
    restart: unless-stopped
    build: { context: ../backend, dockerfile: ../infra/Dockerfile.service, args: { MODULE: presence-service } }
    environment: *common-env
    depends_on:
      redis: { condition: service_healthy }
  presence-2: *presence

  web:
    profiles: [app]
    restart: unless-stopped
    build: { context: ../frontend, dockerfile: ../infra/Dockerfile.web }
    ports: ["8000:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api-1, api-2, presence-1, presence-2]

volumes:
  pgdata:
  cassandradata:
  redisdata:
