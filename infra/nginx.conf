# The book's load balancer: spreads the stateless API and presence servers.
# Chat servers are NOT behind it - clients connect to the one service discovery picks.

upstream api {
    server api-1:8080;
    server api-2:8080;
}

upstream presence {
    server presence-1:8070;
    server presence-2:8070;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/v1/presence {
        proxy_pass http://presence;
    }

    location /ws/presence {
        proxy_pass http://presence;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
