server:
  port: 8070

spring:
  application:
    name: presence-service
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379

chat:
  presence:
    # Book: a client heartbeats every 5s; it is offline after missing heartbeats for this long.
    ttl: 30s
  jwt:
    # Never committed: start every service with the same CHAT_JWT_SECRET (at least 32 bytes).
    secret: ${CHAT_JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
